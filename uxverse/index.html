<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Into the UX-Verse · Rohit Patle</title>
<meta name="description" content="A 3:20 space adventure in 3D, cut paper and comic panels about Rohit Patle, Senior UX/UI Designer and AI UX Designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Kalam:wght@400;700&family=Space+Mono:wght@400;700&display=block">
<link rel="stylesheet" href="uxverse.css">
</head>
<body>
<main class="player">
  <div class="screen" id="screen">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div id="paper"></div>
      <div id="world"></div>
      <canvas id="fx"></canvas>
      <div id="hud"><div class="tl"></div><div class="tr"></div><div class="bl"></div><div class="br"></div></div>
      <div id="bars"><div class="top"></div><div class="bot"></div></div>
      <div id="flash"></div>
      <div id="fade"></div>
    </div>
    <button class="poster" id="poster" type="button" aria-label="Play the film">
      <span class="poster-btn">
        <span class="disc"><svg viewBox="0 0 16 16"><path d="M2 1l13 7-13 7z"/></svg></span>
        <span>Play the film<small id="posterNote">3:20 · sound on</small></span>
      </span>
    </button>
  </div>

  <div class="controls" id="controls">
    <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 16 16"><path d="M3 1l12 7-12 7z"/></svg></button>
    <span class="time" id="time">0:00 / 3:20</span>
    <div class="scrub-wrap">
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="200" aria-valuenow="0">
        <div class="fill" id="fill"></div>
        <div class="head" id="head"></div>
      </div>
    </div>
    <span class="chapter" id="chapter">Signal</span>
    <button id="mute" type="button" aria-label="Mute">Sound on</button>
    <button id="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 16 16"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z"/></svg></button>
    <span class="status" id="status">Loading soundtrack…</span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="js/rohit.js"></script>
<script src="js/space3d.js"></script>
<script src="js/score.js"></script>
<script src="js/core.js"></script>
<script src="js/paper.js"></script>
<script src="js/scenes.js"></script>
<script src="js/player.js"></script>
</body>
</html>
