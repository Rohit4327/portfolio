<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  BEAT "line" — kinetic type segment (transparent, 1080×1920, 30 fps, 18 s; the beat is 125.4 → 142.2 s + a 14-frame fade tail,
  and the outro re-uses the held end state). GSAP times are LOCAL seconds = absolute word time (audio/out/narration_timing.json,
  i.e. timeline.wordAt) − 125.4. Layout constants are shared with src/beats/Line.parts.tsx (the amber point lands as each full stop).
-->
<style>
  @font-face { font-family: 'Inter Display'; font-weight: 800; font-style: normal; src: local('Inter Display ExtraBold'), local('InterDisplay-ExtraBold'), url('./fonts/InterDisplay-ExtraBold.otf') format('opentype'); }
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 800; color: #F6F2E8; }
  .clip { position: absolute; inset: 0; }
  .t { position: absolute; white-space: nowrap; line-height: 1; letter-spacing: -0.04em; will-change: transform, opacity; }
  .mask { position: absolute; overflow: hidden; white-space: nowrap; line-height: 1; letter-spacing: -0.04em; height: 1.1em; }
  .mask > span { display: block; will-change: transform; }
  .cyan { color: #80C9F8; }
  .ivory { color: #F6F2E8; }
  .rule { position: absolute; height: 10px; background: rgba(246,242,232,0.88); border-radius: 5px; width: 0; }
  .amber-rule { position: absolute; height: 3px; background: #FFAB5B; border-radius: 2px; width: 0; }
  .cyan-rule { position: absolute; height: 2px; background: rgba(128,201,248,0.9); border-radius: 1px; width: 0; }
  .outline { color: transparent; -webkit-text-stroke: 2.5px rgba(246,242,232,0.82); }
  .glow { color: #80C9F8; text-shadow: 0 0 28px rgba(128,201,248,0.95), 0 0 90px rgba(128,201,248,0.7), 0 0 200px rgba(128,201,248,0.45); opacity: 0; }
  .stack { letter-spacing: -0.035em; }
</style>
<script src="./gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="18">
  <div id="line-type" class="clip" data-start="0" data-duration="18">

    <!-- A · UI makes a product usable. UX makes it worth using. -->
    <div id="ui" class="t cyan" style="left:72px; top:300px; font-size:320px; opacity:0">UI</div>
    <div id="usableM" class="mask" style="left:72px; top:640px; font-size:150px"><span id="usable">USABLE</span></div>
    <div id="ux" class="t ivory" style="left:555px; top:880px; font-size:320px; opacity:0">UX</div>
    <div id="worthM" class="mask" style="left:127px; top:1200px; font-size:130px"><span id="worth">WORTH USING</span></div>

    <!-- B · Pixel-perfect means nothing if people can't finish the task. -->
    <div id="pixel" class="t ivory" style="left:72px; top:400px; font-size:190px; opacity:0">PIXEL-</div>
    <div id="perfect" class="t ivory" style="left:72px; top:600px; font-size:190px; opacity:0">PERFECT</div>
    <div id="strike1" class="rule" style="left:72px; top:490px"></div>
    <div id="strike2" class="rule" style="left:72px; top:690px"></div>
    <div id="finishM" class="mask" style="left:72px; top:860px; font-size:170px"><span id="finish">FINISH</span></div>
    <div id="taskM" class="mask" style="left:72px; top:1040px; font-size:170px"><span id="task">THE TASK</span></div>
    <div id="under" class="amber-rule" style="left:72px; top:1210px; height:6px"></div>

    <!-- B2 · And a flawless flow still needs an interface people enjoy. -->
    <div id="flawlessM" class="mask" style="left:72px; top:420px; font-size:170px"><span id="flawless" class="outline">FLAWLESS</span></div>
    <div id="flowM" class="mask" style="left:72px; top:600px; font-size:170px"><span id="flow" class="outline">FLOW</span></div>
    <div id="needs" class="cyan-rule" style="left:72px; top:800px"></div>
    <div id="enjoyG" class="t glow" style="left:72px; top:860px; font-size:270px">ENJOY</div>
    <div id="enjoy" class="t ivory" style="left:72px; top:860px; font-size:270px; opacity:0">ENJOY</div>

    <!-- C · Design both. Test with real people. Then do it again. -->
    <div id="arule" class="amber-rule" style="left:72px; top:556px"></div>
    <div id="s1M" class="mask stack" style="left:72px; top:600px; font-size:112px"><span id="s1">DESIGN BOTH</span></div>
    <div id="s2aM" class="mask stack" style="left:72px; top:760px; font-size:112px"><span id="s2a">TEST WITH</span></div>
    <div id="s2bM" class="mask stack" style="left:72px; top:878px; font-size:112px"><span id="s2b">REAL PEOPLE</span></div>
    <div id="s3M" class="mask stack" style="left:72px; top:1040px; font-size:112px"><span id="s3">DO IT AGAIN</span></div>

  </div>
  <script>
    // word times (absolute − 125.4), from narration_timing.json sentences 32–35
    const W = {
      UI: 0.00, usable: 1.10, UX: 1.70, worth: 2.38, using: 2.74,
      pixel: 3.57, means: 4.29, nothing: 4.62, cant: 5.59, finish: 5.91, task: 6.50, sEnd33: 6.92,
      and: 7.22, flawless: 7.52, flow: 8.03, still: 8.29, needs: 8.62, interface: 9.10, people2: 9.66, enjoy: 10.05, sEnd34: 10.53,
      design: 10.83, both: 11.22, test: 11.64, people3: 12.44, then: 12.98, again: 13.54, sEnd35: 14.02,
    };
    const GRAY = '#5B6069';
    const tl = gsap.timeline({ paused: true });
    const slam = (id, at) => tl.fromTo(id, { opacity: 0, scale: 1.22, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: 'expo.out' }, at);
    const rise = (id, at, d = 0.55) => tl.fromTo(id, { yPercent: 112 }, { yPercent: 0, duration: d, ease: 'power3.out' }, at);
    const out = (ids, at, d = 0.24) => tl.to(ids, { opacity: 0, y: -22, duration: d, ease: 'power2.in' }, at);
    const draw = (id, at, w, d = 0.3) => tl.to(id, { width: w, duration: d, ease: 'power2.inOut' }, at);

    // A — lock-ins
    slam('#ui', W.UI + 0.02);
    rise('#usable', W.usable);
    slam('#ux', W.UX);
    rise('#worth', W.worth, 0.6);
    out(['#ui', '#usableM', '#ux', '#worthM'], W.pixel - 0.22);

    // B — strike / underline
    slam('#pixel', W.pixel);
    slam('#perfect', W.pixel + 0.12);
    draw('#strike1', W.means, 557, 0.26);          tl.to('#pixel', { color: GRAY, duration: 0.28 }, W.means + 0.05);
    draw('#strike2', W.nothing, 794, 0.28);        tl.to('#perfect', { color: GRAY, duration: 0.28 }, W.nothing + 0.05);
    rise('#finish', W.finish, 0.5);
    rise('#task', W.task, 0.5);
    draw('#under', W.task + 0.05, 759, 0.4);
    out(['#pixel', '#perfect', '#strike1', '#strike2', '#finishM', '#taskM', '#under'], W.and + 0.02);

    // B2 — outline / glow
    rise('#flawless', W.flawless, 0.55);
    rise('#flow', W.flow, 0.5);
    draw('#needs', W.interface, 430, 0.45);
    slam('#enjoy', W.enjoy);
    tl.to('#enjoy', { color: '#80C9F8', duration: 0.3, ease: 'power2.out' }, W.enjoy + 0.12);
    tl.to('#enjoyG', { opacity: 1, duration: 0.3, ease: 'power2.out' }, W.enjoy + 0.12);
    tl.to('#enjoyG', { opacity: 0.62, duration: 0.09, ease: 'sine.inOut' }, W.enjoy + 0.42);   // one breath of the glow
    tl.to('#enjoyG', { opacity: 1, duration: 0.09, ease: 'sine.inOut' }, W.enjoy + 0.51);      // (must finish before the exit tween below)
    out(['#flawlessM', '#flowM', '#needs', '#enjoy', '#enjoyG'], W.design - 0.18);

    // C — the stack
    draw('#arule', W.design - 0.02, 936, 0.5);
    rise('#s1', W.design + 0.04, 0.55);
    rise('#s2a', W.test, 0.55);
    rise('#s2b', W.test + 0.08, 0.55);
    rise('#s3', W.then, 0.55);
    // hold the end state to the end of the segment (the Remotion side re-uses these frames in the outro)
    tl.to({}, { duration: 0.01 }, 17.98);

    window.__timelines = window.__timelines || {}; window.__timelines['root'] = tl;
  </script>
</div>
</body>
</html>
